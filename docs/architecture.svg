<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .text  { font-size: 12.5px; fill: #334155; }
      .file  { font-size: 11.5px; fill: #64748b; font-family: SFMono-Regular, Menlo, Consolas, monospace; }
      .lane  { font-size: 12px; font-weight: 600; fill: #64748b; letter-spacing: 0.06em; }
      .label { font-size: 11.5px; fill: #475569; }
      .line  { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash  { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1040" height="560" fill="#ffffff"/>

  <!-- Lanes -->
  <rect x="10" y="150" width="1020" height="170" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1016" y="172" class="lane" text-anchor="end">PREDICT · NO GOLD LABELS</text>
  <rect x="10" y="340" width="1020" height="170" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1016" y="362" class="lane" text-anchor="end">SCORE · USES GOLD LABELS</text>

  <!-- Input -->
  <rect x="24" y="190" width="150" height="110" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="36" y="215" class="title">Benchmark CSV</text>
  <text x="36" y="237" class="text">48 agent cases:</text>
  <text x="36" y="254" class="text">task, rules, tools,</text>
  <text x="36" y="271" class="text">trajectory, answer</text>
  <text x="36" y="288" class="text">+ gold labels</text>

  <!-- 1 Load -->
  <rect x="210" y="190" width="180" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="222" y="215" class="title">1. Load and validate</text>
  <text x="222" y="237" class="text">Fills empty fields from</text>
  <text x="222" y="254" class="text">state_json, checks ids</text>
  <text x="222" y="271" class="text">and label values.</text>
  <text x="222" y="290" class="file">loader.py</text>

  <!-- 2 Judge -->
  <rect x="430" y="190" width="180" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="442" y="215" class="title">2. Ask the judge</text>
  <text x="442" y="237" class="text">Sends the case text with</text>
  <text x="442" y="254" class="text">closed questions; rejects</text>
  <text x="442" y="271" class="text">invalid replies once.</text>
  <text x="442" y="290" class="file">judge.py</text>

  <!-- 3 Decide -->
  <rect x="650" y="190" width="180" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="662" y="215" class="title">3. Decide in code</text>
  <text x="662" y="237" class="text">Fixed tables give verdict,</text>
  <text x="662" y="254" class="text">policy flag and 0–4 score</text>
  <text x="662" y="271" class="text">from the answers.</text>
  <text x="662" y="290" class="file">verdict.py</text>

  <!-- predictions.json -->
  <rect x="866" y="210" width="150" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="878" y="238" class="title">predictions.json</text>
  <text x="878" y="260" class="text">one record per case</text>

  <!-- LLM -->
  <rect x="440" y="20" width="240" height="90" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="452" y="45" class="title">Judge model (LLM)</text>
  <text x="452" y="67" class="text">Any OpenAI-compatible API,</text>
  <text x="452" y="84" class="text">hosted or local (e.g. Ollama).</text>
  <text x="452" y="101" class="file">llm.py</text>

  <!-- validation errors -->
  <rect x="200" y="20" width="200" height="70" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="212" y="47" class="title">Invalid rows</text>
  <text x="212" y="69" class="file">validation_errors.jsonl</text>

  <!-- Gold labels -->
  <rect x="210" y="380" width="180" height="110" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="222" y="405" class="title">Gold labels</text>
  <text x="222" y="427" class="text">Expected verdict, score,</text>
  <text x="222" y="444" class="text">policy flag and rationale,</text>
  <text x="222" y="461" class="text">held back from the judge.</text>

  <!-- 4 Score and explain -->
  <rect x="650" y="380" width="180" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="662" y="405" class="title">4. Score and explain</text>
  <text x="662" y="427" class="text">Accuracy, F1, confusion,</text>
  <text x="662" y="444" class="text">policy P/R, MAE; why each</text>
  <text x="662" y="461" class="text">wrong case went wrong.</text>
  <text x="662" y="480" class="file">metrics.py, explain.py</text>

  <!-- 5 report -->
  <rect x="866" y="400" width="150" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="878" y="428" class="title">report.html</text>
  <text x="878" y="450" class="text">opens in the browser</text>

  <!-- Arrows: predict lane -->
  <path d="M174,245 L206,245" class="line"/>
  <path d="M390,245 L426,245" class="line"/>
  <text x="394" y="237" class="label">case</text>
  <path d="M610,245 L646,245" class="line"/>
  <path d="M830,245 L862,245" class="line"/>
  <path d="M300,190 L300,94" class="line"/>
  <!-- judge <-> llm -->
  <path d="M500,190 L500,114" class="line"/>
  <text x="448" y="150" class="label">prompt</text>
  <path d="M540,110 L540,186" class="line"/>
  <text x="548" y="150" class="label">answers</text>

  <!-- Arrows: score lane -->
  <path d="M300,300 L300,376" class="dash"/>
  <text x="308" y="336" class="label">set aside</text>
  <path d="M390,435 L646,435" class="line"/>
  <path d="M941,280 L941,330 L760,330 L760,376" class="line"/>
  <path d="M830,435 L862,435" class="line"/>
  <!-- explain asks the LLM -->
  <path d="M650,400 L630,400 L630,114" class="dash"/>
  <text x="560" y="372" class="label">likely cause</text>

  <!-- Legend -->
  <rect x="24" y="526" width="12" height="12" rx="2" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="42" y="536" class="label">code step</text>
  <rect x="120" y="526" width="12" height="12" rx="2" fill="#fff7ed" stroke="#f97316"/>
  <text x="138" y="536" class="label">language model</text>
  <rect x="246" y="526" width="12" height="12" rx="2" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="264" y="536" class="label">output file</text>
  <text x="380" y="536" class="label">validate = step 1   ·   run = all steps   ·   report = step 4 again from saved predictions</text>
</svg>
